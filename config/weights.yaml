# Scoring config.
#
# signals: what is measured. Each is percentile-ranked across scorable primary
#   substations, oriented so 1 = most stuck (direction: high = a bigger value
#   is more stuck; low = a smaller value is).
#
# views: how the percentiles are combined. Score = weighted sum, scaled 0-100.
#   invert: false -> uses the stuck percentile p (investor: where is demand stuck?)
#   invert: true  -> uses 1 - p                  (developer: where could I connect?)
#   A site missing a signal is scored on the rest, weights re-normalised, and
#   the gap is flagged. Weights need not sum to 100.

signals:
  queue_pressure:
    column: queue_mw
    direction: high
    label: Queue pressure
    description: Demand MW offered and not yet connected.

  headroom_tightness:
    column: demand_headroom_mw
    direction: low
    label: Headroom tightness
    description: Published demand headroom today (MW). Less headroom = tighter.

  utilisation:
    column: utilisation
    direction: high
    label: Utilisation
    description: Observed peak demand / firm capacity.

  recent_activity:
    column: connections_last_year
    direction: high
    label: Recent activity
    description: Demand connection offers accepted in the past year.

  future_squeeze:
    column: headroom_2030_mw
    direction: low
    label: Future squeeze
    description: Forecast 2030 demand headroom (MW, DFES default scenario).

views:
  investor:
    label: Investor
    score_label: Stuck-demand score
    description: Where demand is queuing and published headroom has run out.
    invert: false
    weights:
      queue_pressure: 30
      headroom_tightness: 25
      utilisation: 15
      recent_activity: 15
      future_squeeze: 15

  developer:
    label: Developer
    score_label: Connection opportunity score
    description: Where published headroom is largest and the demand queue shortest.
    invert: true
    weights:
      queue_pressure: 50
      headroom_tightness: 50
      utilisation: 0
      recent_activity: 0
      future_squeeze: 0
