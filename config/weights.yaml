# Scoring config. Explained in docs/SCORING.md.
#
# signals: what is measured. Each is percentile-ranked across scorable primary
#   substations, oriented so 1 = most stuck (direction: high = a bigger value
#   is more stuck; low = a smaller value is). Derived columns are computed in
#   pipeline/score.py add_derived().
#
# views:
#   type: weighted     -> weighted sum of signal percentiles, scaled 0-100.
#                         A site missing a signal is scored on the rest
#                         (weights re-normalised) and the gap is flagged.
#   type: filter_rank  -> no score. Keep sites that pass `filter`, rank them
#                         by `rank_by`, highest first.

signals:
  stuck_mw:
    column: stuck_mw
    direction: high
    label: Stuck demand
    description: "MW of queued demand beyond published headroom: max(queue_mw - demand_headroom_mw, 0)."

  oversubscription:
    column: oversubscription
    direction: high
    label: Oversubscription
    description: "Queue relative to published headroom: queue_mw / max(demand_headroom_mw, 1)."

  headroom_tightness:
    column: demand_headroom_mw
    direction: low
    label: Headroom tightness
    description: Published demand headroom today (MW). Less headroom = tighter.

  utilisation:
    column: utilisation
    direction: high
    label: Utilisation
    description: Observed peak demand / firm capacity.

  recent_activity:
    column: connections_last_year
    direction: high
    label: Recent activity
    description: Demand connection offers accepted in the past year.

  future_squeeze:
    column: headroom_2030_mw
    direction: low
    label: Future squeeze
    description: Forecast 2030 demand headroom (MW, DFES default scenario).

views:
  investor:
    type: weighted
    label: Investor
    score_label: Stuck-demand score
    description: Where demand is queuing beyond published headroom. Leads the demo.
    weights:
      stuck_mw: 25
      oversubscription: 20
      headroom_tightness: 15
      utilisation: 15
      recent_activity: 10
      future_squeeze: 15

  developer:
    type: filter_rank
    label: Developer
    description: Sites with enough published headroom for the load, ranked by headroom left after the queue ahead.
    load_mw_default: 50
    # keep sites where demand_headroom_mw >= load size
    filter_column: demand_headroom_mw
    # rank by headroom_after_queue_mw = demand_headroom_mw - queue_mw, highest first
    rank_by: headroom_after_queue_mw
